<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리움 인프라 구조도</title>
<style>
  :root{
    --ink:#0f172a;
    --muted:#64748b;
    --line:#dbe4ef;
    --blue:#1d4ed8;
    --blue-weak:#eff6ff;
    --green:#059669;
    --green-weak:#ecfdf5;
    --purple:#7c3aed;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    color:var(--ink);
    background:#f8fafc;
    font-family:"Pretendard","Malgun Gothic",-apple-system,"Segoe UI",sans-serif;
  }
  .shell{
    height:100%;
    min-height:100%;
    display:flex;
    flex-direction:column;
  }
  .topbar{
    flex:none;
    height:62px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    padding:10px 18px;
    border-bottom:1px solid var(--line);
    background:rgba(255,255,255,.96);
  }
  .brand{
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  h1{
    margin:0;
    font-size:17px;
    line-height:1.15;
    letter-spacing:0;
  }
  .meta{
    color:var(--muted);
    font-size:12px;
    line-height:1.25;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .tabs{
    display:inline-flex;
    gap:4px;
    padding:4px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#f8fafc;
  }
  .tabs button{
    min-width:112px;
    border:0;
    border-radius:6px;
    padding:9px 14px;
    color:#334155;
    background:transparent;
    font-size:13px;
    font-weight:800;
    cursor:pointer;
  }
  .tabs button:hover{
    background:#e2e8f0;
  }
  .tabs button[aria-selected="true"]{
    color:#fff;
    background:var(--blue);
    box-shadow:0 1px 3px rgba(15,23,42,.18);
  }
  .tabs button[data-csp="naver"][aria-selected="true"]{
    background:var(--green);
  }
  .tabs button[data-csp="summary"][aria-selected="true"]{
    background:var(--purple);
  }
  .tabs button[data-csp="clean"][aria-selected="true"]{
    background:#0f766e;
  }
  .viewer-wrap{
    flex:1;
    min-height:0;
    background:#fff;
  }
  #viewer{
    display:block;
    width:100%;
    height:100%;
    border:0;
    background:#fff;
  }
  @media (max-width:760px){
    .topbar{
      height:auto;
      align-items:stretch;
      flex-direction:column;
      gap:10px;
      padding:12px;
    }
    .meta{
      white-space:normal;
    }
    .tabs{
      width:100%;
      display:grid;
      grid-template-columns:1fr 1fr;
    }
    .tabs button{
      min-width:0;
      width:100%;
    }
  }
  @media (max-width:480px){
    .tabs{
      grid-template-columns:1fr;
    }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <h1>리움(re:도움) 클라우드 인프라 구조도</h1>
      <div class="meta" id="statusText">NHN Cloud 기준 · 공통 개념 모달과 CSP별 용어를 분리</div>
    </div>
    <nav class="tabs" aria-label="보기 선택">
      <button type="button" data-csp="nhn" aria-selected="true">NHN Cloud</button>
      <button type="button" data-csp="naver" aria-selected="false">NAVER Cloud</button>
      <button type="button" data-csp="clean" aria-selected="false">발표용 구조도</button>
      <button type="button" data-csp="summary" aria-selected="false">권고안 요약</button>
    </nav>
  </header>
  <main class="viewer-wrap">
    <iframe id="viewer" title="리움 클라우드 인프라 구조도" src="NHN/인프라_구조도.html"></iframe>
  </main>
</div>
<script>
  const pages = {
    nhn: {
      src: "NHN/인프라_구조도.html",
      text: "NHN Cloud 기준 · Service Gateway, NHN Bastion, m2.c4m8, T4 중심"
    },
    naver: {
      src: "NAVER/인프라_구조도.html",
      text: "NAVER Cloud 기준 · Object Storage Private Endpoint, Secure Access/Bastion, c4-g3, T4 중심"
    },
    clean: {
      src: "common/리움_발표용_인프라_구조도.html",
      text: "발표용 구조도 · 핵심 흐름 중심의 간결한 인프라 개요"
    },
    summary: {
      src: "common/리움_인프라_권고안_요약.html",
      text: "권고안 요약 · 비용, 확정 설계, NHN/NAVER 판단 기준"
    }
  };

  const viewer = document.getElementById("viewer");
  const statusText = document.getElementById("statusText");
  const buttons = Array.from(document.querySelectorAll("[data-csp]"));

  function normalizeCsp(value){
    return value === "naver" || value === "clean" || value === "summary" ? value : "nhn";
  }

  function setCsp(value, writeHash){
    const csp = normalizeCsp(value);
    viewer.src = pages[csp].src;
    statusText.textContent = pages[csp].text;
    buttons.forEach((button) => {
      button.setAttribute("aria-selected", button.dataset.csp === csp ? "true" : "false");
    });
    if(writeHash){
      history.replaceState(null, "", "#" + csp);
    }
  }

  buttons.forEach((button) => {
    button.addEventListener("click", () => setCsp(button.dataset.csp, true));
  });

  window.addEventListener("hashchange", () => setCsp(location.hash.slice(1), false));
  setCsp(location.hash.slice(1), false);
</script>
</body>
</html>
